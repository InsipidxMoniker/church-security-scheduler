{% extends "base.html" %}{% block content %}
<h1>Staff sign in</h1><p>Use your individual account. An authenticator code is required after your password.</p>
<form method="post" action="/login">
<input type="hidden" name="csrf" value="{{ csrf }}">
<label>Username<input name="username" autocomplete="username" maxlength="100" required></label>
<label>Password<input name="password" type="password" autocomplete="current-password" maxlength="256" required></label>
<button>Continue</button></form>
<p>For an account or lost authenticator, contact your Administrator. Initial setup and local recovery use the operator instructions.</p>
{% endblock %}
